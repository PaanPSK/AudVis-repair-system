<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>AudVis API Test</title>
</head>
<body>
  <h1>AudVis Repair API Test</h1>
  <button onclick="testAPI()">Test API</button>
  <p id="result">รอทดสอบ...</p>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxuu9sUCVvHv1EJY_RjGbb7C5rhFWeT-ajobHmRjjccUgu5A1dMgIZcyU_GODsO5tC8VA/exec";

    async function testAPI() {
      const result = document.getElementById("result");
      result.textContent = "กำลังทดสอบ...";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "ping" })
        });

        const data = await response.json();
        result.textContent = JSON.stringify(data);

      } catch (error) {
        result.textContent = "Error: " + error.message;
        console.error(error);
      }
    }
  </script>
</body>
</html>
